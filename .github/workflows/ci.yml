services:
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: acbu_ci
      POSTGRES_PASSWORD: acbu_ci_pw
      POSTGRES_DB: acbu_ci
    ports:
      - 5432:5432
    options: >-
      --health-cmd "pg_isready -U acbu_ci -d acbu_ci"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 10

  mongodb:
    image: mongo:7.0.11
    env:
      MONGO_INITDB_ROOT_USERNAME: acbu_ci
      MONGO_INITDB_ROOT_PASSWORD: acbu_ci_pw
      MONGO_INITDB_DATABASE: acbu_ci_cache
    ports:
      - 27017:27017
    options: >-
      --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
      --health-interval 10s
      --health-timeout 5s
      --health-retries 10

  rabbitmq:
    image: rabbitmq:3.13.4-management-alpine
    env:
      RABBITMQ_DEFAULT_USER: acbu_ci
      RABBITMQ_DEFAULT_PASS: acbu_ci_pw
    ports:
      - 5672:5672
      - 15672:15672
    options: >-
      --health-cmd "rabbitmq-diagnostics ping"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 10
